name: Build Raspberry Pi image

# Builds a flashable 64-bit (arm64) Raspberry Pi OS image with the Home Display
# appliance baked in, and attaches the compressed .img.xz to the GitHub Release.
# Also runnable on demand from the Actions tab.
#
# 64-bit covers Pi 5 / 4 / 400 / CM4 (recommended) and also boots Pi 3 / Zero 2 W
# (below the Pi 4 bar — see appliance/README.md). A separate 32-bit (armhf) image
# for pre-64-bit boards is intentionally NOT built: a Chromium/Wayland kiosk isn't
# viable on those, and the dashboard targets Pi 4.
#
# CI uses the built-in GITHUB_TOKEN — no personal token needed. pi-gen builds via
# qemu (~30–45 min). verbose-output is on so failures show the real pi-gen error.

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write   # attach image assets to the release

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pi-gen builds the arm64 rootfs by running ARM binaries in a chroot on the
      # x86 runner — that needs qemu-aarch64 registered in binfmt_misc, or it dies
      # with "arm64: not supported on this machine/kernel". This registers it.
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build image (arm64 / 64-bit)
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: home-display-arm64
          # Lite base (stage0–2) + our appliance stage (adds the Wayland kiosk).
          stage-list: stage0 stage1 stage2 ./appliance/pi-gen-stage
          release: bookworm
          # pi-gen-version defaults to "arm64" (64-bit) in this action — leave it.
          verbose-output: true
          compression: xz
          compression-level: 6
          enable-ssh: 1
          disable-first-boot-user-rename: 1
          username: dash
          password: homedisplay
        env:
          DASHBOARD_REPO: https://github.com/${{ github.repository }}.git
          DASHBOARD_BRANCH: ${{ github.ref_name }}

      - name: Attach image to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}

      - name: Upload image as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: home-display-arm64
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 14
